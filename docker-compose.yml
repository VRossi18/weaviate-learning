version: '3.4'
services:
   weaviate:
      image: semitechnologies/weaviate:1.21.3
      restart: on-failure:0
      ports:
         - '8080:8080'
      environment:
         QUERY_DEFAULTS_LIMIT: 20
         AUTHENTICATION_ANONYMOUS_ACCESS_ENABLED: 'true'
         PERSISTENCE_DATA_PATH: './data'
         ENABLE_MODULES: 'multi2vec-clip,text2vec-contextionary'
         DEFAULT_VECTORIZER_MODULE: multi2vec-clip
         CLIP_INFERENCE_API: http://multi2vec-clip:8080
         CONTEXTIONARY_URL: contextionary:9999
         CLUSTER_HOSTNAME: 'node1'
   multi2vec-clip:
      image: semitechnologies/multi2vec-clip:sentence-transformers-clip-ViT-B-32-multilingual-v1
      environment:
         ENABLE_CUDA: 0
   contextionary:
      image: docker.io/semitechnologies/contextionary:en0.16.0-v1.2.1
      environment:
         OCCURRENCE_WEIGHT_LINEAR_FACTOR: 0.75
         EXTENSIONS_STORAGE_MODE: weaviate
         EXTENSIONS_STORAGE_ORIGIN: http://weaviate:8080
         NEIGHBOR_OCCURRENCE_IGNORE_PERCENTILE: 5
         ENABLE_COMPOUND_SPLITTING: 'false'
