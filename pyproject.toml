[project]
name = "vector-databases"
version = "0.1.0"
description = "Exercises and helpers for Weaviate vector databases."
readme = "README.md"
authors = [
    { name = "Vinicius Rossi", email = "viniciusprossi18@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "ipython",
    "matplotlib",
    "mediawikiapi>=1.3",
    "numpy",
    "pandas",
    "pytest>=9.1.1",
    "requests",
    "streamlit",
    "weaviate-client>=3.26.7,<4.0.0",
]

[project.scripts]
wiki = "vector_databases.wikipedia:main"

[build-system]
requires = ["uv_build>=0.12.10,<0.13.0"]
build-backend = "uv_build"
